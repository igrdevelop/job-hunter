# The obsolete `version:` key was removed: Compose v2 ignores it and prints a
# warning on every single command, which buries real output during an incident.
services:
  job-hunter:
    image: ghcr.io/igrdevelop/job-hunter:${IMAGE_TAG:-latest}
    container_name: job-hunter
    restart: always
    env_file:
      - .env
    environment:
      # tracker.db lives in a DIRECTORY mount (./db) so its WAL sidecars
      # (-wal/-shm) are shared with job-hunter-api. A single-file bind mount
      # gave each container its OWN sidecars over one main file — the copies
      # diverged and corrupted the db (2026-08-07 incident). One-time host
      # migration: mkdir -p db && mv tracker.db* db/
      TRACKER_DB_PATH: /app/db/tracker.db
    volumes:
      # Holds tracker.db + its WAL sidecars; shared with job-hunter-api's
      # compose (mounted there as /app/data/db). Create before first run:
      #   mkdir -p db && mv tracker.db* db/
      - ./db:/app/db
      - ./tracker.xlsx:/app/tracker.xlsx
      - ./Applications:/app/Applications
      - ./backups:/app/backups
      # Only ever READ at runtime (LinkedIn Playwright session state; refreshed
      # by tools/linkedin_login.py, not by the bot process) — mounted :ro
      # (docs/improvement-2026-09/05-SECURITY_PLAN.md M1/M7).
      - ./.secrets:/app/.secrets:ro
      # OAuth client secret, never rewritten by the bot — :ro. The paired
      # *_token.json below IS rewritten (token auto-refresh, hunter/oauth_alert.py)
      # and stays read-write.
      - ./gmail_credentials.json:/app/gmail_credentials.json:ro
      - ./gmail_token.json:/app/gmail_token.json
      - ./gsheets_credentials.json:/app/gsheets_credentials.json:ro
      - ./gsheets_token.json:/app/gsheets_token.json
      # WARNING: gsheets_state.json must be a FILE on the host before first run.
      # If it doesn't exist Docker will auto-create a directory, breaking GSheets sync.
      # Fix: touch ./gsheets_state.json  (or echo '{}' > ./gsheets_state.json)
      - ./gsheets_state.json:/app/gsheets_state.json
      # Claude CLI state for the LLM-outage fallback (docs/
      # LLM_OUTAGE_RESILIENCE_PLAN.md M4). Being able to AUTHENTICATE is the
      # on/off switch — no env flag: an API billing outage then automatically
      # retries through the subscription. On this host authentication comes
      # from CLAUDE_CODE_OAUTH_TOKEN in .env (a long-lived `claude
      # setup-token` token — it does not rotate, unlike the OAuth login whose
      # refresh failure blanked this volume's .credentials.json on
      # 2026-09-08); the volume still carries the CLI's own config/sessions
      # and an interactive login if one was done. Host dir is .claude-cli (NOT
      # .claude — that's the repo's own slash-commands dir) and holds PERSONAL
      # subscription credentials; gitignored, never commit. Interactive login
      # (desktop-style alternative to the token):
      #   docker compose exec -it job-hunter claude
      # then follow the OAuth URL flow; the login persists in this volume.
      # Target is the non-root `hunter` user's home (docs/improvement-2026-09/
      # 05-SECURITY_PLAN.md M1 — was /root/.claude before the container
      # switched off root); a fresh host ./.claude-cli must be owned by the
      # container's uid (1000) — see the Dockerfile's `useradd --uid 1000`.
      - ./.claude-cli:/home/hunter/.claude
      - ./logs:/app/logs
      # Candidate data — all personal files live in candidate/ (see candidate/README.md).
      - ./candidate:/app/candidate:ro
      # Per-user storage root (multi-user, docs/MULTI_USER_UPDATE.md). After the
      # owner-data migration, CANDIDATE_YAML_PATH / APPLICATIONS_DIR in .env
      # point inside /app/users/{userId}/. Shared with job-hunter-api (its
      # compose mounts the same host dir at /app/data/users).
      - ./users:/app/users
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"