version: "3.9"

services:
  job-hunter:
    image: ghcr.io/igrdevelop/job-hunter:${IMAGE_TAG:-latest}
    container_name: job-hunter
    restart: always
    env_file:
      - .env
    volumes:
      # tracker.db must exist on the host before first run.
      # If it doesn't exist Docker will auto-create a directory, breaking the tracker.
      # Fix: touch ./tracker.db  (the bot will initialise the schema on first start)
      - ./tracker.db:/app/tracker.db
      - ./tracker.xlsx:/app/tracker.xlsx
      - ./Applications:/app/Applications
      - ./backups:/app/backups
      - ./.secrets:/app/.secrets
      - ./gmail_credentials.json:/app/gmail_credentials.json
      - ./gmail_token.json:/app/gmail_token.json
      - ./gsheets_credentials.json:/app/gsheets_credentials.json
      - ./gsheets_token.json:/app/gsheets_token.json
      # WARNING: gsheets_state.json must be a FILE on the host before first run.
      # If it doesn't exist Docker will auto-create a directory, breaking GSheets sync.
      # Fix: touch ./gsheets_state.json  (or echo '{}' > ./gsheets_state.json)
      - ./gsheets_state.json:/app/gsheets_state.json
      # Claude CLI login for the LLM-outage fallback (docs/
      # LLM_OUTAGE_RESILIENCE_PLAN.md M4). The login IS the on/off switch — no
      # env flag: with credentials here, an API billing outage automatically
      # retries through the Pro subscription; empty dir = fallback off. Host
      # dir is .claude-cli (NOT .claude — that's the repo's own slash-commands
      # dir) and holds the owner's PERSONAL subscription OAuth credentials;
      # gitignored, never commit. One-time login:
      #   docker compose exec -it job-hunter claude
      # then follow the OAuth URL flow; the login persists in this volume.
      - ./.claude-cli:/root/.claude
      - ./logs:/app/logs
      # Candidate data — all personal files live in candidate/ (see candidate/README.md).
      - ./candidate:/app/candidate:ro
      # Per-user storage root (multi-user, docs/MULTI_USER_UPDATE.md). After the
      # owner-data migration, CANDIDATE_YAML_PATH / APPLICATIONS_DIR in .env
      # point inside /app/users/{userId}/. Shared with job-hunter-api (its
      # compose mounts the same host dir at /app/data/users).
      - ./users:/app/users
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"