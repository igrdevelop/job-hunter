# CodeRabbit configuration — https://docs.coderabbit.ai/reference/configuration
# First line of automated PR review (general bugs / risky patterns).
# Project-specific invariants are ALSO enforced locally by the
# project-invariants-review agent (.claude/agents/) — the digest below exists
# so CodeRabbit flags the same classes of drift on PRs opened outside
# Claude Code. CLAUDE.md remains the source of truth.

language: "en-US"

tone_instructions: >-
  Be direct and concise. Prioritize real bugs, data-loss risks, silent
  failure paths and contract violations. Skip formatting/style nits — ruff
  (lint + format) already gates them in CI.

reviews:
  profile: "chill"
  # true = CodeRabbit submits a blocking "changes requested" review and lifts
  # it once its comments are resolved. Combined with master's branch
  # protection (require conversation resolution), a PR cannot merge while
  # rabbit findings are unresolved.
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!requirements.lock"
    - "!docs/AGENT_LOG.md"
    - "!tests/fixtures/**"
  path_instructions:
    - path: "**/*.py"
      instructions: >-
        Autonomous job-application bot: Python 3.11, async python-telegram-bot,
        SQLite tracker, LLM pipeline. Repo invariants (full text in CLAUDE.md):
        (1) Personal candidate facts (name, city, phone, employers, school)
        must be read via hunter/candidate.py `candidate.get(dotpath, default)`
        with a NEUTRAL default — flag any hardcoded personal string in
        production code, and any new `candidate.get()` dotpath missing from
        candidate/candidate.yaml.example.
        (2) Best-effort subsystems (Sheets/Drive/Telegram/shadow/writer style)
        must wrap their swallow-and-continue try/except in
        `hunter.best_effort.best_effort("subsystem.name")` — flag new bare
        exception swallows that silently degrade.
        (3) Dependencies live in pyproject.toml only; requirements.lock is
        generated by `uv pip compile` — flag any hand edit to the lock, and
        any pyproject.toml dependency change without a matching lock change.
        (4) A new job source must cover all five registration points: source
        module, config toggle, ALL_SOURCES, the `_fetch_roster()` dispatch
        list, and the CLAUDE.md tables — flag partial wiring.
        (5) Code comments, commit messages and PR text are English-only.
        (6) Behavior changes should update CLAUDE.md in the same PR.
    - path: "hunter/tracker.py"
      instructions: >-
        Column index constants are hardcoded and mirrored in CLAUDE.md's
        schema table and four separate Sheets writers (A-K push,
        sent_normalizer L, cost_writer M, verdict_writer N) — flag schema
        drift. Terminal-status writers must check `_is_known_terminal()`
        URL-ONLY and clear their own PENDING/IN_PROGRESS placeholder before
        inserting; watch claim/release/convert semantics regressions.
    - path: ".claude/commands/apply.md"
      instructions: >-
        This file is the LIVE prompt of the CLI apply pipeline (run via
        `claude -p`), not documentation. It must never instruct the model to
        ask a question (non-interactive: a question kills the run), and its
        logic must stay in sync with hunter/apply_api.py — hand-copied drift
        between the two pipelines has caused several production incidents.
    - path: "tests/**"
      instructions: >-
        Tests mock only external boundaries (LLM via fake_llm, network,
        subprocesses, Telegram, LibreOffice). Flag tests that monkeypatch the
        internal pipeline stages they claim to verify, and regression tests
        that would pass even without the fix they guard.

chat:
  auto_reply: true
