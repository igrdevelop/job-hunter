name: Deploy Job Hunter
# docker-compose.yml is fetched via curl on deploy — no scp needed

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff==0.15.16
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.lock
      - name: Run tests
        # No --cov-fail-under yet (docs/quality/04-coverage-and-golden-e2e.md
        # Part A): map the blind spots for a few weeks before gating on them.
        # --durations=20 (docs/improvement-2026-09/04-ENGINEERING_PLAN.md M0.2/M3)
        # surfaces the slowest tests in the job summary below, so a new slow
        # test is visible without anyone running --durations locally.
        run: |
          pytest tests/ -q --cov=hunter --cov-report=xml --cov-report=term --durations=20 \
            | tee pytest_output.log
          {
            echo "### Slowest tests (--durations=20)"
            echo '```'
            awk '/^=+ slowest [0-9]+ durations =+$/,0' pytest_output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

  # Blocking since docs/improvement-2026-09/04-ENGINEERING_PLAN.md M2: mypy_baseline.json
  # (mypy_ratchet.py) tracks a per-file error count and only fails the build on a
  # REGRESSION — a file's count going up, or a brand-new file carrying errors that
  # were never baselined. A file's count going down is reported but never fails.
  # This makes `typecheck` a real gate without first driving the pre-existing
  # 218-error baseline (54 files, mostly PTB `Message | None` / `JobQueue | None`
  # unchecked attribute access) to zero. Reduce the baseline deliberately with
  # `python scripts/mypy_ratchet.py --update` in its own commit.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.lock
      - name: mypy regression ratchet
        # Runs the same `mypy hunter/ llm_client.py generate_docs.py apply_agent.py`
        # invocation internally and prints its raw output before the ratchet verdict.
        run: python scripts/mypy_ratchet.py

  # Informational only — deploy does NOT depend on it. Skips itself cleanly
  # until the repo is connected on sonarcloud.io and SONAR_TOKEN is added to
  # the repo secrets (free for public repos).
  sonarcloud:
    needs: [test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - name: Check SONAR_TOKEN present
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "SONAR_TOKEN not set — skipping SonarCloud scan"
          fi
      - uses: actions/checkout@v4
        if: steps.sonar.outputs.enabled == 'true'
        with:
          fetch-depth: 0  # full history for accurate new-code detection
      - name: Download coverage report
        if: steps.sonar.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: coverage-xml
      - name: SonarCloud scan
        if: steps.sonar.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-and-deploy:
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Abort on the FIRST failing command. Without this the step's exit
            # code came from whatever ran last -- `docker image prune`, which
            # succeeds even when nothing else did -- so a failed `docker compose
            # pull` left the previous container running while CI reported green
            # and the "Notify on failure" step below never fired. Measured cost
            # of the omission (2026-08-29): two days of green master over a prod
            # that was silently two commits behind.
            set -eo pipefail
            cd ${{ secrets.VPS_WORK_DIR }}
            curl -fsSL https://raw.githubusercontent.com/igrdevelop/job-hunter/master/docker-compose.yml -o docker-compose.yml
            touch gsheets_state.json
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export IMAGE_TAG=${{ github.sha }}

            # Reclaim BEFORE pulling. Every deploy tags its image with a commit
            # SHA, and the original `docker image prune -f` only removed
            # DANGLING (untagged) images -- so it never removed a single deploy
            # image; by 2026-08-29 that was 17 images / 63.9 GB reclaimable and
            # a 75 GB disk at 100%. The 2026-08-29 fix, `prune -a --filter
            # until=168h`, capped the AGE of an image but not their NUMBER: on
            # 2026-09-12 the disk was full again with TEN job-hunter images of
            # ~8.1 GB each, all younger than two days, and the time window
            # could not reclaim any of them. scripts/docker_prune.sh (fetched
            # next to docker-compose.yml, so the deploy and the host cron in
            # docs/DEPLOY.md run the same file) keeps the image
            # behind the live container plus ONE previous job-hunter image as
            # a rollback target and removes the rest, then runs the generic
            # `prune -a --filter until=168h` for everything else on this shared
            # daemon (job-hunter-api, arifma, psybook leave images here and
            # never prune -- reclaiming their week-old leftovers is intended).
            # Anything removed is re-pullable from GHCR by SHA. Runs again
            # after `up -d` below so the steady state between deploys is
            # exactly two job-hunter images (~16 GB), not three. Fetched by
            # the SHA being deployed, not `master`: raw.githubusercontent.com
            # caches for ~5 min (404s included), so a `master` URL can hand
            # the first deploy after a merge a stale or missing copy, and it
            # would otherwise run whatever master holds rather than the
            # version in this commit.
            curl -fsSL https://raw.githubusercontent.com/igrdevelop/job-hunter/${{ github.sha }}/scripts/docker_prune.sh -o docker_prune.sh
            sh docker_prune.sh

            # A pull that runs out of disk mid-extraction is the exact failure
            # this block exists to prevent, so check before spending the
            # download. The image is ~8.1 GB UNCOMPRESSED (Playwright chromium
            # + LibreOffice + Claude CLI -- `docker images ghcr.io/igrdevelop/
            # job-hunter` on the host, measured 2026-09-12), and the compressed
            # layers sit on disk alongside it while they extract. The old floor
            # of 5000 MB was written against a "~2 GB compressed" figure that
            # was never the extracted size, so a deploy passed the check and
            # then filled the disk mid-extraction -- which is also how the bot's
            # startup token refresh wrote gsheets_token.json as a 0-byte file
            # and killed the Sheets mirror until it was restored by hand.
            # 12000 MB = the real image + ~50% headroom; re-measure and raise
            # this whenever the Dockerfile grows.
            AVAIL_MB=$(df -Pm / | awk 'NR==2 {print $4}')
            if [ "$AVAIL_MB" -lt 12000 ]; then
              echo "Only ${AVAIL_MB} MB free on / - need at least 12000 MB to pull and extract the ~8.1 GB image."
              df -h /
              docker system df
              exit 1
            fi

            docker compose pull
            docker compose up -d

            # Settle to live + 1 previous: the image that was live before this
            # deploy is now the rollback target, the one before it goes.
            sh docker_prune.sh

      - name: Notify on failure
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ❌ Job Hunter deploy FAILED
            Commit: ${{ github.sha }}
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}